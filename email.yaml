openapi: 3.0.0
info:
  title: Email Service API
  version: 1.0.0
  description: Send transactional and marketing emails. Most email triggers are handled via asynchronous events.

paths:
  /email/welcome:
    post:
      summary: Manually trigger welcome email (fallback)
      tags: [Email]
      security:
        - bearerAuth: []
      description: |
        Sends a welcome email to the user. Normally this is triggered automatically via an event (e.g., USER_REGISTERED),
        but this endpoint is available for manual use or fallback scenarios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - name
              properties:
                email:
                  type: string
                  example: user@example.com
                name:
                  type: string
                  example: Jane
      responses:
        '200':
          description: Email sent successfully

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


openapi: 3.0.0
info:
  title: Payment Service API
  version: 1.0.0
  description: Handle order payments using Wompi.
paths:
  /payments:
    post:
      summary: Process payment
      tags: [Payments]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                amount:
                  type: number
                payment_method:
                  type: string
                  enum: [card, pse, nequi]
      responses:
        '200':
          description: Payment processed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: Manage user registration and profile.
paths:
  /users:
    post:
      summary: Register new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  example: jane@example.com
                password:
                  type: string
                  example: password123
      responses:
        '201':
          description: User created

openapi: 3.0.0
info:
  title: User Service API
  version: 1.0.0
  description: Manage user registration and profile.

paths:
  /users:
    post:
      summary: Register new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  example: jane@example.com
                password:
                  type: string
                  example: password123
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "user_123456"
                  message:
                    type: string
                    example: User successfully registered.
        '400':
          description: Invalid input
        '409':
          description: Email already registered

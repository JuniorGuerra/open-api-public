
openapi: 3.0.0
info:
  title: Authentication Service API
  version: 1.0.0
  description: Handles user authentication using JWT.
paths:
  /auth/login:
    post:
      summary: User login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: mypassword
      responses:
        '200':
          description: JWT token returned
  /auth/refresh:
    post:
      summary: Refresh JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token
  /auth/validate:
    get:
      summary: Validate JWT token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

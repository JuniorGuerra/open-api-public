
openapi: 3.0.0
info:
  title: Invoice Service API
  version: 1.0.0
  description: Generate and retrieve invoices.
paths:
  /invoices:
    post:
      summary: Create invoice
      tags: [Invoices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
      responses:
        '201':
          description: Invoice created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

openapi: 3.0.0
info:
  title: Cart Service API
  version: 1.0.0
  description: Manage shopping cart for authenticated users.

paths:
  /cart:
    get:
      summary: Get current user's cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id:
                          type: string
                        name:
                          type: string
                        quantity:
                          type: integer
                        price:
                          type: number
                        subtotal:
                          type: number
        '401':
          description: Unauthorized

    post:
      summary: Add item to cart
      tags: [Cart]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - quantity
              properties:
                product_id:
                  type: string
                  example: prod-abc123
                quantity:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        '200':
          description: Item added to cart
        '400':
          description: Invalid input
        '401':
          description: Unauthorized

  /cart/item/:product_id:
    delete:
      summary: Remove item from cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Item removed from cart
        '401':
          description: Unauthorized
        '404':
          description: Item not found in cart

  /cart/clear:
    delete:
      summary: Empty the cart
      tags: [Cart]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart emptied successfully
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

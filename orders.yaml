openapi: 3.0.0
info:
  title: Order Service API
  version: 1.0.0
  description: Manage customer orders created from the user's active cart.

paths:
  /orders:
    get:
      summary: Retrieve all orders of the authenticated user
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized

    post:
      summary: Create new order from current cart
      tags: [Orders]
      description: |
        Creates an order based on the contents of the authenticated user's cart.
        The system will validate that the cart is not empty and calculate totals internally.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipping_address
              properties:
                shipping_address:
                  type: string
                  example: "Carrera 5 #10-20, Bogotá"
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Cart is empty or invalid shipping address
        '401':
          description: Unauthorized

  /orders/{id}:
    get:
      summary: Get order details by ID
      tags: [Orders]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example: ord-123
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
        '401':
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          example: ord-123
        user_id:
          type: string
          example: user-001
        status:
          type: string
          enum: [pending_payment, paid, shipped, cancelled]
          example: pending_payment
        created_at:
          type: string
          format: date-time
          example: 2025-05-02T14:00:00Z
        shipping_address:
          type: string
          example: Carrera 5 #10-20, Bogotá
        total:
          type: number
          example: 75000
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                example: prod-001
              name:
                type: string
                example: Colombian Coffee
              quantity:
                type: integer
                example: 2
              price:
                type: number
                example: 34000
              subtotal:
                type: number
                example: 68000

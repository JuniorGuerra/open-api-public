
openapi: 3.0.0
info:
  title: Order Service API
  version: 1.0.0
  description: Manage customer orders.
paths:
  /orders:
    get:
      summary: Get user orders
      tags: [Orders]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
    post:
      summary: Create new order
      tags: [Orders]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                shipping_address:
                  type: string
      responses:
        '201':
          description: Order created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
